<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#CD853F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 枫叶主体 -->
  <path d="M64 20 
           C64 20, 45 25, 35 35
           C25 45, 20 64, 20 64
           C20 64, 25 83, 35 93
           C45 103, 64 108, 64 108
           C64 108, 83 103, 93 93
           C103 83, 108 64, 108 64
           C108 64, 103 45, 93 35
           C83 25, 64 20, 64 20
           Z" 
        fill="url(#leafGradient)" 
        filter="url(#shadow)"
        stroke="#654321" 
        stroke-width="2"/>
  
  <!-- 枫叶叶脉 -->
  <path d="M64 20 L64 108" 
        stroke="#654321" 
        stroke-width="3" 
        stroke-linecap="round"/>
  
  <path d="M35 35 L93 93" 
        stroke="#654321" 
        stroke-width="2" 
        stroke-linecap="round"/>
  
  <path d="M93 35 L35 93" 
        stroke="#654321" 
        stroke-width="2" 
        stroke-linecap="round"/>
  
  <!-- 枫叶边缘装饰 -->
  <path d="M64 20 
           C64 20, 55 22, 48 28
           C41 34, 38 42, 36 50
           C34 58, 33 64, 33 64
           C33 64, 34 70, 36 78
           C38 86, 41 94, 48 100
           C55 106, 64 108, 64 108
           C64 108, 73 106, 80 100
           C87 94, 90 86, 92 78
           C94 70, 95 64, 95 64
           C95 64, 94 58, 92 50
           C90 42, 87 34, 80 28
           C73 22, 64 20, 64 20
           Z" 
        fill="none" 
        stroke="#654321" 
        stroke-width="1.5" 
        opacity="0.6"/>
  
  <!-- 中心装饰点 -->
  <circle cx="64" cy="64" r="4" fill="#654321" opacity="0.8"/>
</svg>
