<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>孔明智能助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }
        
        .header h1 {
            color: white;
            font-size: 18px;
            font-weight: 600;
        }

        .settings-btn {
            position: absolute;
            right: 12px;
            top: 12px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #333;
            border-radius: 8px;
            height: 32px;
            padding: 0 10px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .settings-btn:hover {
            background: #ffffff;
        }
        
        .header .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            margin-top: 4px;
        }
        
        .stream-status {
            background: rgba(0, 122, 255, 0.1);
            border: 1px solid rgba(0, 122, 255, 0.3);
            border-radius: 8px;
            margin: 10px 15px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #007AFF;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            background: #007AFF;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in;
            line-height: 1.5;
        }
        
        .user-message {
            background: #007AFF;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }
        
        .ai-message {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            position: relative;
        }
        
        .ai-message.thinking::after {
            content: '...';
            animation: thinking 1.5s infinite;
            font-weight: bold;
        }
        
        @keyframes thinking {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        .ai-message.streaming {
            border-left: 3px solid #007AFF;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.1);
        }
        
        .ai-message.streaming::after {
            content: '|';
            color: #007AFF;
            animation: cursor 1s infinite;
            margin-left: 2px;
        }
        
        @keyframes cursor {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .ai-message.typing {
            border-right: 2px solid #007AFF;
            animation: typing 0.8s infinite;
        }
        
        @keyframes typing {
            0%, 50% { border-right-color: transparent; }
            51%, 100% { border-right-color: #007AFF; }
        }
        
        .input-container {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .message-input:focus {
            background: white;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.3);
        }
        
        .send-btn {
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .send-btn:hover {
            background: #0056CC;
            transform: scale(1.05);
        }
        
        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            max-width: 85%;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .ai-reasoning {
            color: #888;
            font-style: italic;
            font-size: 13px;
            margin: 8px 0 2px 0;
            white-space: pre-wrap;
            display: block;
            max-width: 85%;
            background: rgba(240,240,240,0.8);
            border-radius: 8px;
            padding: 8px 14px;
            box-sizing: border-box;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧠 孔明智能助手</h1>
        <div class="subtitle">智能问答 · 推理分析 · 知识助手</div>
        <button id="settingsBtn" class="settings-btn" title="设置 MCP 地址">⚙️ 设置</button>
    </div>
    
    <div class="stream-status" id="streamStatus" style="display: none;">
        <span class="status-indicator"></span>
        <span class="status-text">正在接收AI回复...</span>
    </div>
    
    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            你好！我是孔明智能助手，拥有强大的推理能力和丰富的知识储备。有什么可以帮助你的吗？
        </div>
    </div>
    
    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" id="messageInput" class="message-input" placeholder="输入你的问题..." maxlength="1000">
            <button id="sendBtn" class="send-btn">
                <span id="sendIcon">➤</span>
            </button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="panel.js"></script>
</body>
</html>
