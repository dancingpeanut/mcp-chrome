[package]
name = "rust-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = [] }
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "rt-multi-thread", "signal"] }
tracing = { version = "0.1" }
tokio-util = { version = "0.7" }
rmcp = { version = "0.6", features = ["server", "transport-sse-server"] }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
] }
serde = { version = "1.0.219", features = ["derive"] }
futures-util = "0.3.31"
uuid = { version = "1.18.0", features = ["v4"] }
tokio-stream = "0.1.17"
chrono = "0.4.41"
serde_json = "1.0.143"
dashmap = "5.0"
tower-http = { version = "0.5", features = ["cors", "trace"] }
async-stream = "0.3"

[build-dependencies]