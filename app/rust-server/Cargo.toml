[package]
name = "rust-server"
version = "0.1.0"
edition = "2024"

[dependencies]
rootcause = "0.11"
axum = { version = "0.8", features = [] }
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "rt-multi-thread", "signal"] }
tracing = { version = "0.1" }
rmcp = { version = "0.6", features = ["server", "transport-streamable-http-server", "transport-worker"] }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
] }
serde = { version = "1.0.219", features = ["derive"] }
futures-util = "0.3.31"
uuid = { version = "1.18.0", features = ["v4"] }
chrono = "0.4.41"
serde_json = "1.0.143"
dashmap = "5.0"
http = "1.3.1"

[build-dependencies]